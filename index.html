<div class="hero-visual">
  <div class="hero-illustration">
    <!-- The glowing background circle -->
    <div class="glow-sparkle"></div>

    <!-- The flower element on top -->
    <svg class="swaying-flower" width="100" height="150" viewBox="0 0 100 150">
      <!-- Your SVG flower art goes here -->
      <circle cx="50" cy="50" r="20" fill="var(--accent)" />
      <line x1="50" y1="70" x2="50" y2="150" stroke="var(--muted)" stroke-width="4" />
    </svg>

    <!-- The status log stacked cleanly underneath -->
    <div class="status-log">
      <span class="status-dot"></span>
      <p class="status-text" id="garden-status">Growing</p>
    </div>
  </div>
</div>

<!-- JavaScript to dynamically update or control the status text -->
<script>
  // Quick helper to change the status string when you need to update it
  function updateGardenStatus(newStatus) {
    const statusElement = document.getElementById('garden-status');
    if (statusElement) {
      statusElement.textContent = newStatus;
    }
  }

  // Example: Change status after a simulated delay or application event
  // updateGardenStatus('Fully Bloomed!');
</script>
